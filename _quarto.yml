project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    # The assignment sources are handed out as files for students to fill in,
    # not rendered into the site. They are copied into docs/ by the resources
    # entry below, so the link on assignments/index.qmd downloads the .qmd
    # itself. Rendering them here would make Quarto rewrite that link to .html.
    - "!assignments/**/Assignment-*.qmd"
    # Answer keys never go on the site, whatever they are named.
    - "!assignments/**/*answer-key*"
    # The dataset catalogue is course material, not a page of the site. It has
    # its own _quarto.yml so that rendering it writes data-catalog/datasets.html
    # rather than anything under docs/.
    - "!data-catalog/"
    - "!sample-project/"
    - "!lectures/Chapter-0/logistics.qmd"
    - "!lectures/Chapter-4-Data-Visualization/04-4-Misc.qmd"
    - "!sample-project-reproducible/code/main/*.qmd"
    - "!sample-project-reproducible/writing/*.qmd"
    - "!templates/"
  # Measure what every WebR cell prints, before the render, so the side-by-side
  # layout is decided from the real output. Only decks whose .qmd is newer than
  # their .js are re-measured, so this costs nothing on an unchanged render.
  pre-render:
    - lectures/measure-webr-output.R
  # Measured output sizes for the WebR cells, written by
  # _lecture-shared/measure-webr-output.R and read at load by webr-layout.html.
  # Without this they are not copied into the site and every cell falls back to
  # judging its layout on the code alone.
  resources:
    - "lectures/**/*.webr-output.js"
    # The assignment sources themselves, so students can download the .qmd they
    # write their answers in, not just read the rendered page.
    # Listed one by one on purpose. A glob here would also copy the answer
    # keys that live in the same folders straight onto the website.
    - "assignments/Assignment-1/Assignment-1.qmd"
    - "assignments/Assignment-2/Assignment-2.qmd"
    - "assignments/Assignment-3/Assignment-3.qmd"
    - "assignments/Assignment-4/Assignment-4.qmd"
    - "assignments/Assignment-5/Assignment-5.qmd"
    - "assignments/Assignment-6/Assignment-6.qmd"
    - "assignments/Assignment-7/Assignment-7.qmd"

website:
  title: "Data Science with R (Kobe University)"
  open-graph: true # https://quarto.org/docs/websites/website-tools.html#open-graph
  page-footer: "Made with Quarto"
  navbar:
    right:
      - text: Syllabus
        href: syllabus/syllabus_26.qmd
      - text: Lecture Notes
        href: lectures/index.qmd
      - text: Assignments
        href: assignments/index.qmd
      # - text: Slides
      #   menu:
      #     - text: 01 - Univariate Regression
      #       href: lectures/univariate/univariate_regression_x.rmd
format:
  html:
    html-math-method:
      method: katex
      url: "https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/"
    mainfont: sans-serif
    # monofont: system-ui
    # fontsize: 24px
    # linestretch: # space between lines
    # max-width:
    page-layout: full
    theme: [cosmo, styles.scss]
